<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Webcam Overlay — Settings</title>
<style>
  :root {
    color-scheme: dark;
    --bg:      #1e2126;
    --panel:   #262a31;
    --line:    #343943;
    --text:    #dfe3e8;
    --muted:   #8b939f;
    --accent:  #4aa3ff;
    --danger:  #ff5f56;
    --ok:      #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
  }
  main { padding: 18px 20px 90px; }

  h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
    margin: 26px 0 10px;
  }
  h2:first-child { margin-top: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
  }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row label.name { flex: 1; min-width: 0; }
  .row .sub { display: block; color: var(--muted); font-size: 11.5px; }

  input[type="text"], input[type="number"], select {
    background: #1a1d22; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; font: inherit; min-width: 0;
  }
  input[type="text"], select { width: 236px; }
  input[type="number"] { width: 92px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input.bad { border-color: var(--danger); }

  input[type="range"] { width: 190px; accent-color: var(--accent); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  .val { width: 54px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .corners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 236px; }

  /* Overlay picker */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tabs button.tab {
    padding: 6px 12px; border-radius: 999px;
    background: #262a31; border: 1px solid var(--line);
  }
  .tabs button.tab.sel {
    background: var(--accent); border-color: var(--accent);
    color: #06121f; font-weight: 600;
  }
  .tabs button.tab .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); margin-right: 6px; vertical-align: 1px;
  }
  .tabs button.tab.live .dot { background: var(--ok); }
  .tabs button.add { padding: 6px 10px; }
  button {
    background: #30353d; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 7px 10px; font: inherit; cursor: pointer;
  }
  button:hover { background: #3a4049; }
  button.on { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }

  .note { color: var(--muted); font-size: 11.5px; margin: 8px 2px 0; }
  .pill {
    font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.ok   { color: var(--ok);     border-color: #24502f; }
  .pill.bad  { color: var(--danger); border-color: #5c2b28; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: #1a1d22; border-top: 1px solid var(--line);
  }
  footer .path {
    flex: 1; min-width: 0; color: var(--muted); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  code { background: #14171b; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<main>

  <h2>Overlays</h2>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="row">
      <label class="name" for="name">
        Name
        <span class="sub">Shown in the menus and reported to controllers</span>
      </label>
      <input type="text" id="name" spellcheck="false">
    </div>
    <div class="row">
      <label class="name" for="camera">
        Webcam
        <span class="sub" id="cameraNote">Choose which camera this overlay shows.</span>
      </label>
      <select id="camera"></select>
    </div>
    <div class="row">
      <label class="name">
        Remove this overlay
        <span class="sub" id="removeNote"></span>
      </label>
      <button id="remove">Remove</button>
    </div>
  </div>

  <h2 id="appearanceH2">Appearance</h2>
  <div class="panel">
    <div class="row">
      <label class="name" for="opacity">Opacity</label>
      <input type="range" id="opacity" min="10" max="100" step="5">
      <span class="val" id="opacityVal"></span>
    </div>
    <div class="row">
      <label class="name" for="radius">Corner radius</label>
      <input type="range" id="radius" min="0" max="80" step="1">
      <span class="val" id="radiusVal"></span>
    </div>
    <div class="row">
      <label class="name" for="fit">
        Image fit
        <span class="sub" id="fitNote"></span>
      </label>
      <select id="fit">
        <option value="cover">Fill &amp; crop</option>
        <option value="contain">Fit whole image</option>
        <option value="fill">Stretch</option>
      </select>
    </div>
    <div class="row">
      <label class="name">
        Match window to camera
        <span class="sub" id="fitCamNote"></span>
      </label>
      <button id="fitCam">Resize</button>
    </div>
    <div class="row">
      <label class="name" for="zoom">
        Zoom
        <span class="sub" id="zoomNote"></span>
      </label>
      <input type="range" id="zoom" min="100" max="400" step="5">
      <span class="val" id="zoomVal"></span>
    </div>
    <div class="row">
      <label class="name" for="panX">
        Pan X
        <span class="sub" id="panNote"></span>
      </label>
      <input type="range" id="panX" min="0" max="100" step="1">
      <span class="val" id="panXVal"></span>
    </div>
    <div class="row">
      <label class="name" for="panY">Pan Y</label>
      <input type="range" id="panY" min="0" max="100" step="1">
      <span class="val" id="panYVal"></span>
    </div>
    <div class="row">
      <label class="name">
        Recentre image
        <span class="sub">Puts both axes back to 50%.</span>
      </label>
      <button id="recentre">Centre</button>
    </div>
    <div class="row">
      <label class="name" for="mirror">
        Mirror image
        <span class="sub">Flip left-to-right. Natural for a face cam; leave off for
          anything with text or a second angle.</span>
      </label>
      <input type="checkbox" id="mirror">
    </div>
  </div>

  <h2 id="positionH2">Position &amp; size</h2>
  <div class="panel">
    <div class="row">
      <label class="name">
        Move to corner
        <span class="sub" id="cornerNote"></span>
      </label>
      <div class="corners">
        <button data-corner="top-left">Top left</button>
        <button data-corner="top-right">Top right</button>
        <button data-corner="bottom-left">Bottom left</button>
        <button data-corner="bottom-right">Bottom right</button>
      </div>
    </div>
    <div class="row">
      <label class="name" for="width">Size <span class="sub">width × height, in pixels</span></label>
      <input type="number" id="width" min="160" max="4096" step="1">
      <input type="number" id="height" min="120" max="4096" step="1">
    </div>
    <div class="row">
      <label class="name" for="margin">Corner margin <span class="sub">gap from the screen edge</span></label>
      <input type="number" id="margin" min="0" max="400" step="1">
    </div>
  </div>

  <h2>Hotkeys</h2>
  <div class="panel">
    <div class="row">
      <label class="name" for="hkShow">
        Show / hide
        <span class="sub">Electron accelerator, e.g. <code>CommandOrControl+Alt+W</code></span>
      </label>
      <span class="pill" id="hkShowState"></span>
      <input type="text" id="hkShow" spellcheck="false">
    </div>
    <div class="row">
      <label class="name" for="hkMax">Maximize / window mode</label>
      <span class="pill" id="hkMaxState"></span>
      <input type="text" id="hkMax" spellcheck="false">
    </div>
  </div>
  <p class="note">
    A hotkey already owned by another application will fail to register and show
    as <b>taken</b>. Changes apply as soon as the field loses focus.
  </p>

  <h2>System</h2>
  <div class="panel">
    <div class="row">
      <label class="name" for="startup">
        Start with Windows
        <span class="sub">Adds a “Webcam Overlay” entry to your startup apps</span>
      </label>
      <input type="checkbox" id="startup">
    </div>
    <div class="row">
      <label class="name" for="editor">
        Config editor
        <span class="sub" id="editorNote"></span>
      </label>
      <input type="text" id="editor" placeholder="auto-detect" spellcheck="false">
    </div>
    <div class="row">
      <label class="name">
        Always on top
        <span class="sub">Windows drops overlays out of the topmost band when a
          fullscreen app takes the foreground. This puts them back.</span>
      </label>
      <button id="reassert">Bring back on top</button>
    </div>
    <div class="row">
      <label class="name" for="keepTop">
        Re-assert every
        <span class="sub" id="keepTopNote"></span>
      </label>
      <input type="number" id="keepTop" min="0" max="3600" step="0.25">
    </div>
    <div class="row">
      <label class="name" for="port">
        Control port
        <span class="sub">Used by the Stream Deck plugin — needs a restart</span>
      </label>
      <input type="number" id="port" min="0" max="65535" step="1">
    </div>
  </div>

</main>

<footer>
  <span class="path" id="configPath"></span>
  <span class="pill" id="saveState"></span>
  <button id="save">Save now</button>
  <button id="openConfig">Open config.json</button>
  <button id="close">Close</button>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Guards against the "settings" push echoing back as a change event while the
  // user is mid-edit, which would fight the caret in text fields.
  let loading = false;
  let snap = null;
  // Which overlay the per-overlay sections are editing.
  let sel = null;

  const apply = (patch) => window.settings.apply(patch);
  // Every per-overlay change has to name its target, or main would apply it to
  // the primary overlay instead of the one on screen.
  const applyToSel = (patch) => apply({ ...patch, overlay: sel });

  const confFor  = (s, id) => s.config.overlays.find((o) => o.id === id);
  const stateFor = (s, id) => s.overlays.find((o) => o.id === id);

  function renderTabs(s) {
    const tabs = $('tabs');
    tabs.innerHTML = '';
    for (const ov of s.overlays) {
      const b = document.createElement('button');
      b.className = 'tab' + (ov.id === sel ? ' sel' : '') + (ov.visible ? ' live' : '');
      b.innerHTML = '<span class="dot"></span>';
      b.appendChild(document.createTextNode(ov.name));
      b.title = ov.visible ? 'visible' : 'hidden';
      b.addEventListener('click', () => { sel = ov.id; render(snap); });
      tabs.appendChild(b);
    }
    const add = document.createElement('button');
    add.className = 'add';
    add.textContent = '+ Add overlay';
    add.addEventListener('click', () => apply({ addOverlay: true }));
    tabs.appendChild(add);
  }

  function render(s) {
    snap = s;
    loading = true;

    // Keep the selection valid across adds and removals.
    if (!sel || !stateFor(s, sel)) sel = s.overlays.length ? s.overlays[0].id : null;

    renderTabs(s);

    const c  = s.config;
    const oc = sel ? confFor(s, sel)  : null;
    const os = sel ? stateFor(s, sel) : null;

    if (oc && os) {
      $('name').value = oc.name || '';
      $('appearanceH2').textContent = 'Appearance — ' + oc.name;
      $('positionH2').textContent   = 'Position & size — ' + oc.name;

      // Camera
      const cam = $('camera');
      cam.innerHTML = '';
      const def = document.createElement('option');
      def.value = '';
      def.textContent = 'System default';
      cam.appendChild(def);

      for (const d of s.cameras) {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.textContent = d.label || 'Camera ' + (d.deviceId || '').slice(0, 6);
        cam.appendChild(o);
      }

      const known = s.cameras.some((d) => d.deviceId === oc.camera_id);
      if (oc.camera_id && !known) {
        // Saved camera isn't plugged in; keep it visible rather than silently
        // snapping the dropdown to something the user didn't choose.
        const o = document.createElement('option');
        o.value = oc.camera_id;
        o.textContent = (oc.camera_label || 'Saved camera') + ' — not connected';
        cam.appendChild(o);
      }
      cam.value = oc.camera_id || '';
      $('cameraNote').textContent = s.cameras.length
        ? 'Choose which camera this overlay shows.'
        : 'No cameras detected yet.';

      $('remove').disabled = s.overlays.length <= 1;
      $('removeNote').textContent = s.overlays.length <= 1
        ? 'The last overlay cannot be removed.'
        : 'Closes the window and drops it from config.json.';

      // Appearance
      $('opacity').value = Math.round((os.opacity ?? 1) * 100);
      $('opacityVal').textContent = $('opacity').value + '%';
      $('radius').value = oc.corner_radius ?? 16;
      $('radiusVal').textContent = $('radius').value + ' px';
      $('mirror').checked = !!oc.mirror;
      $('fit').value = oc.fit || 'cover';
      $('fitNote').textContent = {
        cover:   'Crops whatever does not fit the window.',
        contain: 'Shows the whole frame, letterboxed.',
        fill:    'Stretches to the window — distorts the image.'
      }[oc.fit || 'cover'];

      const zoomPct = Math.round((oc.zoom ?? 1) * 100);
      $('zoom').value = zoomPct;
      $('zoomVal').textContent = zoomPct + '%';
      $('zoomNote').textContent = zoomPct > 100
        ? 'Crops in, so Pan can reframe without leaving a gap.'
        : 'At 100% Pan still works, but far from centre it leaves empty space.';

      $('panX').value = oc.pan_x ?? 50;
      $('panY').value = oc.pan_y ?? 50;
      $('panXVal').textContent = $('panX').value + '%';
      $('panYVal').textContent = $('panY').value + '%';
      $('recentre').disabled = (oc.pan_x ?? 50) === 50 && (oc.pan_y ?? 50) === 50;
      $('panNote').textContent = oc.fit === 'fill'
        ? 'No effect on “Stretch” — the image already fills the window.'
        : 'Higher looks further right / down. Past the cropped area it leaves a gap;'
          + ' raise Zoom to avoid that.';

      const v = os.video;
      $('fitCam').disabled = !v;
      $('fitCamNote').textContent = v
        ? `Sets the height to match the ${v.width}×${v.height} stream, so nothing is cropped.`
        : 'Waiting for the camera to report its size.';

      // Position & size
      for (const b of document.querySelectorAll('[data-corner]')) {
        b.classList.toggle('on', os.corner === b.dataset.corner && os.mode === 'windowed');
      }
      $('cornerNote').textContent =
        os.mode === 'maximized' ? 'Currently maximized — this will restore it first.'
        : os.corner            ? 'Currently in the ' + os.corner.replace('-', ' ') + ' corner.'
                               : 'Not in a corner right now.';
      if (os.bounds) {
        $('width').value  = os.bounds.width;
        $('height').value = os.bounds.height;
      }
    }

    $('margin').value = c.corner_margin ?? 24;

    // Hotkeys
    $('hkShow').value = c.hotkeys.toggle_visibility || '';
    $('hkMax').value  = c.hotkeys.toggle_maximize   || '';
    for (const [id, key] of [['hkShowState', 'toggle_visibility'], ['hkMaxState', 'toggle_maximize']]) {
      const ok = s.hotkeyOk?.[key];
      const el = $(id);
      el.textContent = ok ? 'active' : 'taken';
      el.className = 'pill ' + (ok ? 'ok' : 'bad');
    }

    // System
    $('startup').checked = !!s.startup;
    $('editor').value = c.editor || '';
    $('editorNote').textContent = 'Blank auto-detects — currently ' + (s.editor || 'Notepad');
    const keepTop = c.keep_on_top_seconds ?? 0;
    $('keepTop').value = keepTop;
    $('keepTopNote').textContent = keepTop > 0
      ? `Seconds. How long it stays buried after you tab out of a fullscreen game. `
        + `0 turns this off.`
      : 'Off — use the button above when it happens. Set a number of seconds to automate it.';

    $('port').value = c.control_port ?? 0;
    $('configPath').textContent = s.configPath;

    // Writes are coalesced to keep SSD wear down, so say plainly whether what's
    // on screen has reached the disk yet.
    const saveEl = $('saveState');
    saveEl.textContent = s.unsaved ? 'unsaved' : 'saved';
    saveEl.className = 'pill ' + (s.unsaved ? 'bad' : 'ok');
    saveEl.title = s.unsaved
      ? `Changes are in memory; they write within ${s.saveSeconds}s, on quit, or when you press Save now.`
      : 'Everything is written to config.json.';
    $('save').disabled = !s.unsaved;

    loading = false;
  }

  // --- wiring ---------------------------------------------------------------

  $('camera').addEventListener('change', (e) => {
    if (loading) return;
    const opt = e.target.selectedOptions[0];
    applyToSel({
      camera_id:    e.target.value || null,
      camera_label: e.target.value ? opt.textContent : null
    });
  });

  $('opacity').addEventListener('input', (e) => {
    $('opacityVal').textContent = e.target.value + '%';
    if (!loading) applyToSel({ opacity: Number(e.target.value) / 100 });
  });

  $('radius').addEventListener('input', (e) => {
    $('radiusVal').textContent = e.target.value + ' px';
    if (!loading) applyToSel({ corner_radius: Number(e.target.value) });
  });

  $('mirror').addEventListener('change', (e) => {
    if (!loading) applyToSel({ mirror: e.target.checked });
  });

  $('fit').addEventListener('change', (e) => {
    if (!loading) applyToSel({ fit: e.target.value });
  });

  $('fitCam').addEventListener('click', () => applyToSel({ fitToCamera: true }));

  $('zoom').addEventListener('input', (e) => {
    $('zoomVal').textContent = e.target.value + '%';
    if (!loading) applyToSel({ zoom: Number(e.target.value) / 100 });
  });

  $('panX').addEventListener('input', (e) => {
    $('panXVal').textContent = e.target.value + '%';
    if (!loading) applyToSel({ pan_x: Number(e.target.value) });
  });

  $('panY').addEventListener('input', (e) => {
    $('panYVal').textContent = e.target.value + '%';
    if (!loading) applyToSel({ pan_y: Number(e.target.value) });
  });

  $('recentre').addEventListener('click', () => applyToSel({ recentre: true }));

  for (const b of document.querySelectorAll('[data-corner]')) {
    b.addEventListener('click', () => applyToSel({ corner: b.dataset.corner }));
  }

  $('remove').addEventListener('click', () => {
    if (sel) apply({ removeOverlay: sel });
  });

  const onCommit = (el, build, perOverlay) => {
    const fire = () => {
      if (loading) return;
      (perOverlay ? applyToSel : apply)(build(el.value));
    };
    el.addEventListener('change', fire);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.blur(); });
  };

  onCommit($('name'),   (v) => ({ name: v }),            true);
  onCommit($('width'),  (v) => ({ width:  Number(v) }),  true);
  onCommit($('height'), (v) => ({ height: Number(v) }),  true);
  onCommit($('margin'), (v) => ({ corner_margin: Number(v) }));
  onCommit($('port'),    (v) => ({ control_port: Number(v) }));
  onCommit($('keepTop'), (v) => ({ keep_on_top_seconds: Number(v) }));

  $('reassert').addEventListener('click', () => apply({ reassertTop: true }));
  onCommit($('editor'), (v) => ({ editor: v.trim() || null }));
  onCommit($('hkShow'), (v) => ({ hotkeys: { toggle_visibility: v.trim() } }));
  onCommit($('hkMax'),  (v) => ({ hotkeys: { toggle_maximize:   v.trim() } }));

  $('startup').addEventListener('change', (e) => {
    if (!loading) apply({ startup: e.target.checked });
  });

  $('save').addEventListener('click', async () => render(await window.settings.save()));
  $('openConfig').addEventListener('click', () => window.settings.openConfig());
  $('close').addEventListener('click', () => window.settings.close());

  window.settings.onChange((s) => {
    // Don't yank a field the user is typing in.
    const active = document.activeElement;
    const typing = active && active.tagName === 'INPUT' && active.type === 'text';
    if (typing) { snap = s; return; }
    render(s);
  });

  window.settings.get().then(render);
})();
</script>
</body>
</html>
