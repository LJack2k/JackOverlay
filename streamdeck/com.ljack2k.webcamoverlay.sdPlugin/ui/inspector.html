<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Webcam Overlay</title>
<style>
  /*
   * Deliberately no sdpi-components CDN import: the property inspector is a web
   * view, and a remote stylesheet/script means a blank panel whenever the
   * machine is offline. Everything here is local.
   */
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 14px 16px;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    color: #d8d8d8; background: #2d2d2d;
  }
  label { display: block; margin-bottom: 5px; color: #969696; font-size: 12px; }
  select, input[type="number"] {
    width: 100%; box-sizing: border-box;
    padding: 6px 8px; font: inherit;
    color: #e8e8e8; background: #3d3d3d;
    border: 1px solid #4a4a4a; border-radius: 3px;
  }
  select:focus, input:focus { outline: none; border-color: #0078ff; }
  .row { margin-bottom: 14px; }
  .hint { color: #8a8a8a; font-size: 11.5px; margin: -8px 0 12px; }
  code { background: #242424; padding: 1px 4px; border-radius: 2px; color: #c8c8c8; }
  hr { border: none; border-top: 1px solid #3d3d3d; margin: 16px 0; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6c7480; flex: none; }
  .dot.ok  { background: #3fb950; }
  .dot.bad { background: #ff5f56; }
  button {
    padding: 6px 12px; font: inherit;
    color: #e8e8e8; background: #3d3d3d;
    border: 1px solid #4a4a4a; border-radius: 3px; cursor: pointer;
  }
  button:hover { background: #464646; }
</style>
</head>
<body>

<div class="row">
  <label for="overlay">Overlay to control</label>
  <select id="overlay"></select>
</div>
<p class="hint" id="overlayHint">
  Which overlay window this key acts on.
</p>

<hr>

<div class="row">
  <label for="port">Overlay control port</label>
  <input id="port" type="number" min="1" max="65535" step="1" value="28492">
</div>
<p class="hint">
  Must match <code>control_port</code> in the overlay's <code>config.json</code>.
  Shared by every key. Default is <code>28492</code>.
</p>

<div class="row"><button id="reconnect" type="button">Apply &amp; reconnect</button></div>

<div class="status"><span class="dot" id="dot"></span><span id="msg">Connecting…</span></div>

<script>
  let ws = null;
  let uuid = null;          // this inspector's context, used for get/setSettings
  let actionUUID = null;    // the action's manifest id, needed by sendToPlugin
  let settings = {};        // this key's own settings
  let known = [];           // overlays reported by the plugin

  const overlayEl = document.getElementById("overlay");
  const portEl    = document.getElementById("port");
  const dotEl     = document.getElementById("dot");
  const msgEl     = document.getElementById("msg");
  const hintEl    = document.getElementById("overlayHint");

  function setStatus(text, kind) {
    msgEl.textContent = text;
    dotEl.className = "dot" + (kind ? " " + kind : "");
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function saveSettings() {
    send({ event: "setSettings", context: uuid, payload: settings });
  }

  function renderOverlays() {
    const chosen = settings.overlay || "";
    overlayEl.innerHTML = "";

    const primary = document.createElement("option");
    primary.value = "";
    primary.textContent = known.length
      ? "Primary overlay (" + known[0].name + ")"
      : "Primary overlay";
    overlayEl.appendChild(primary);

    for (const o of known) {
      const opt = document.createElement("option");
      opt.value = o.id;
      opt.textContent = o.name + "  (" + o.id + ")";
      overlayEl.appendChild(opt);
    }

    // A key can point at an overlay that has since been removed. Keep it listed
    // rather than silently retargeting it somewhere the user didn't choose.
    if (chosen && !known.some((o) => o.id === chosen)) {
      const opt = document.createElement("option");
      opt.value = chosen;
      opt.textContent = chosen + " — not found";
      overlayEl.appendChild(opt);
    }

    overlayEl.value = chosen;
    hintEl.textContent = known.length
      ? "Which overlay window this key acts on. “Primary” follows the first overlay in config.json."
      : "The overlay app isn't running, so its windows can't be listed yet.";
  }

  overlayEl.addEventListener("change", () => {
    settings.overlay = overlayEl.value || "";
    saveSettings();
    setStatus(settings.overlay ? "Targeting " + settings.overlay : "Targeting the primary overlay", "ok");
  });

  function savePort() {
    const port = Number(portEl.value);
    if (!Number.isFinite(port) || port < 1 || port > 65535) {
      setStatus("Port must be between 1 and 65535", "bad");
      return;
    }
    send({ event: "setGlobalSettings", context: uuid, payload: { port } });
    setStatus("Saved — plugin reconnecting on port " + port, "ok");
  }

  portEl.addEventListener("change", savePort);
  document.getElementById("reconnect").addEventListener("click", savePort);

  // Stream Deck calls this global once the property inspector has loaded.
  // eslint-disable-next-line no-unused-vars
  function connectElgatoStreamDeckSocket(inPort, inUUID, registerEvent, inInfo, inActionInfo) {
    uuid = inUUID;
    try {
      const info = JSON.parse(inActionInfo);
      actionUUID = info.action;
      settings = info.payload?.settings ?? {};
    } catch (_) {
      settings = {};
    }
    renderOverlays();

    ws = new WebSocket("ws://127.0.0.1:" + inPort);

    ws.onopen = () => {
      send({ event: registerEvent, uuid: uuid });
      send({ event: "getGlobalSettings", context: uuid });
      // Ask the plugin for the live overlay list; it also pushes one on open.
      send({ event: "sendToPlugin", action: actionUUID, context: uuid, payload: { request: "overlays" } });
      setStatus("Connected", "ok");
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.event === "didReceiveGlobalSettings") {
        const saved = msg.payload?.settings?.port;
        if (saved) portEl.value = saved;
      }

      if (msg.event === "didReceiveSettings") {
        settings = msg.payload?.settings ?? {};
        renderOverlays();
      }

      if (msg.event === "sendToPropertyInspector" && msg.payload?.event === "overlays") {
        known = msg.payload.overlays ?? [];
        renderOverlays();
        if (!msg.payload.connected) setStatus("Overlay app not running", "bad");
        else setStatus("Connected", "ok");
      }
    };

    ws.onclose = () => setStatus("Disconnected from Stream Deck", "bad");
    ws.onerror = () => setStatus("Connection error", "bad");
  }
</script>

</body>
</html>
