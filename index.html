<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self' blob: mediastream:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    /*
     * Deliberately NO -webkit-app-region: drag here.
     * On Windows a drag region is hit-tested as the title bar, so right-clicks
     * never reach the page and the context menu becomes unreachable. Dragging is
     * done manually via pointer events + IPC instead (see script below).
     */
  }

  #container {
    width: 100%; height: 100%;
    border-radius: var(--radius, 16px);
    overflow: hidden;
    background: #111;
    position: relative;
    cursor: move;
  }

  video {
    /* Size and offset are computed in relayout() rather than left to
       object-fit/object-position. Those only ever expose the slack the fit
       happens to leave — with a 16:9 source in a narrow window that is zero
       vertically, so Pan Y had nothing to move. Doing the arithmetic here means
       zoom can create overscan on both axes at any window shape. */
    position: absolute;
    left: 0; top: 0;
    display: block;
    /* --flip is -1 when the overlay is set to mirror, 1 otherwise. Off by
       default: mirroring only feels right for a face cam, and makes anything
       else (text, a second angle) read backwards. */
    transform: scaleX(var(--flip, 1));
    /* Also rounded here, not just clipped by #container: a transformed child
       gets its own compositing layer and can bleed past overflow:hidden. */
    border-radius: var(--radius, 16px);
  }

  #error {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    color: #ff6b6b; font-family: sans-serif; font-size: 13px;
    text-align: center; padding: 16px;
    background: #111;
    border-radius: var(--radius, 16px);
  }

  /* Resize grip in the bottom-right corner */
  #grip {
    position: absolute;
    right: 0; bottom: 0;
    width: 20px; height: 20px;
    cursor: se-resize;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #grip::after {
    content: '';
    position: absolute;
    right: 3px; bottom: 3px;
    width: 8px; height: 8px;
    border-right: 2px solid rgba(255,255,255,0.5);
    border-bottom: 2px solid rgba(255,255,255,0.5);
    pointer-events: none;
  }
  #container:hover #grip { opacity: 1; }
</style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <div id="error">No camera found.</div>
  <div id="grip" title="Drag to resize"></div>
</div>

<script>
(() => {
  const video     = document.getElementById('video');
  const error     = document.getElementById('error');
  const grip      = document.getElementById('grip');
  const container = document.getElementById('container');

  // ---- Corner radius ----------------------------------------------------
  function applyRadius(px) {
    const n = Number(px);
    document.documentElement.style.setProperty(
      '--radius', (Number.isFinite(n) ? Math.max(0, n) : 16) + 'px'
    );
  }

  function applyMirror(on) {
    document.documentElement.style.setProperty('--flip', on ? '-1' : '1');
  }

  // ---- Image layout -----------------------------------------------------
  // How the frame sits inside the window: which fit, how far zoomed in, and
  // which part of the overscan is on screen.
  const layout = { fit: 'cover', zoom: 1, panX: 50, panY: 50 };

  // Extra pan travel beyond the overscan, as a fraction of the window. 1 means
  // the extremes push the image half out of frame, which is about as far as is
  // useful. 0 would restore "pan only within the crop".
  const FREE_TRAVEL = 1;

  const clamp = (v, lo, hi, fallback) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
  };

  function relayout() {
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    if (!cw || !ch) return;

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    let iw, ih;
    if (!vw || !vh) {
      iw = cw; ih = ch;                      // nothing playing yet
    } else if (layout.fit === 'fill') {
      iw = cw * layout.zoom;                 // deliberately non-uniform
      ih = ch * layout.zoom;
    } else {
      const base = layout.fit === 'contain'
        ? Math.min(cw / vw, ch / vh)
        : Math.max(cw / vw, ch / vh);
      const scale = base * layout.zoom;
      iw = vw * scale;
      ih = vh * scale;
    }

    // Pan travels over the overscan *plus* a free allowance of one window
    // dimension, so the image can always be repositioned — even at 100% zoom,
    // where a 16:9 camera in a narrow window has no vertical overscan at all.
    // Past the overscan the image simply leaves a gap, which is the price of
    // being able to move it.
    //
    // Expressed as an offset from centre so that 50 is always centred, and so
    // that with FREE_TRAVEL at 0 this reduces exactly to sliding through the
    // overscan (pan 0 flush to the left/top edge).
    const ox = iw - cw;
    const oy = ih - ch;
    const rangeX = ox + cw * FREE_TRAVEL;
    const rangeY = oy + ch * FREE_TRAVEL;
    const left = (cw - iw) / 2 + (0.5 - layout.panX / 100) * rangeX;
    const top  = (ch - ih) / 2 + (0.5 - layout.panY / 100) * rangeY;

    video.style.width  = iw + 'px';
    video.style.height = ih + 'px';
    video.style.left   = Math.round(left) + 'px';
    video.style.top    = Math.round(top) + 'px';
  }

  function applyFit(fit) {
    layout.fit = ['cover', 'contain', 'fill'].includes(fit) ? fit : 'cover';
    relayout();
  }

  function applyPan(pan) {
    layout.panX = clamp(pan?.x, 0, 100, 50);
    layout.panY = clamp(pan?.y, 0, 100, 50);
    relayout();
  }

  function applyZoom(z) {
    layout.zoom = clamp(z, 1, 4, 1);
    relayout();
  }

  // Live updates from the menus, the settings window and config.json edits
  window.api.onCornerRadius(applyRadius);
  window.api.onMirror(applyMirror);
  window.api.onFit(applyFit);
  window.api.onPan(applyPan);
  window.api.onZoom(applyZoom);

  // The window is freely resizable, and every dimension change alters the
  // overscan, so the layout has to be recomputed rather than set once.
  new ResizeObserver(relayout).observe(container);

  // ---- Webcam ------------------------------------------------------------
  let stream = null;

  // Report the stream's own dimensions so main can offer "fit window to camera".
  // Listeners are attached once, not per-start: 'loadedmetadata' can fire before
  // a listener added straight after setting srcObject, and 'resize' covers the
  // intrinsic size changing when the camera is switched.
  function reportVideoSize() {
    if (video.videoWidth && video.videoHeight) {
      window.api.reportVideoSize(video.videoWidth, video.videoHeight);
      // The intrinsic size is an input to the layout, so recompute now it's known.
      relayout();
    }
  }
  video.addEventListener('loadedmetadata', reportVideoSize);
  video.addEventListener('resize', reportVideoSize);

  // Bumped by every release, so a getUserMedia that resolves after the overlay
  // was hidden (or the camera switched again) can tell it has been superseded
  // and throw its stream away instead of quietly turning the device back on.
  let generation = 0;

  // Shown in the overlay itself, and reported up so the tray menu, settings and
  // Stream Deck keys can all reflect it rather than the overlay just going dark.
  let cameraFailed = false;

  function showCameraError(message) {
    releaseCamera();
    cameraFailed = true;
    video.style.display = 'none';
    error.style.display = 'flex';
    error.textContent = message;
    window.api.reportCameraError(message);
  }

  function releaseCamera() {
    generation++;
    if (stream) {
      // stop() is what actually frees the device and puts the capture light out.
      for (const track of stream.getTracks()) track.stop();
      stream = null;
    }
    video.srcObject = null;
  }

  async function startCamera(deviceId) {
    releaseCamera();
    const gen = generation;
    try {
      // Ask for 1080p. Without a resolution constraint Chromium takes whatever
      // the device offers by default, and some virtual cameras default to
      // 640x480 — which is not only low-res but 4:3, so the picture arrives with
      // a different aspect ratio than a physical webcam and looks squashed or
      // over-cropped. `ideal` (not `exact`) so cameras that can't do 1080p still
      // work and just give their closest match.
      const videoConstraints = deviceId ? { deviceId: { exact: deviceId } } : {};
      videoConstraints.width  = { ideal: 1920 };
      videoConstraints.height = { ideal: 1080 };

      const opened = await navigator.mediaDevices.getUserMedia({
        video: videoConstraints, audio: false
      });

      // Hidden (or switched again) while getUserMedia was in flight — drop it
      // rather than attaching a device we are no longer meant to be holding.
      if (gen !== generation) {
        for (const track of opened.getTracks()) track.stop();
        return;
      }

      stream = opened;
      video.srcObject = stream;
      error.style.display = 'none';
      video.style.display = 'block';
      reportVideoSize();      // in case metadata is already available
      cameraFailed = false;
      window.api.reportCameraError(null);

      // A camera can vanish mid-session — unplugged, or grabbed exclusively by
      // another app. The track ends but the element keeps showing the last frame,
      // so without this the overlay silently freezes.
      for (const track of stream.getTracks()) {
        track.addEventListener('ended', () => {
          if (gen !== generation) return;      // already replaced deliberately
          showCameraError('Camera disconnected');
        });
      }
    } catch (e) {
      // Deliberately no falling back to a different device. Quietly showing the
      // wrong camera on a live overlay is worse than showing nothing: you might
      // not notice, and it could be pointed at something you didn't intend.
      showCameraError(describeCameraError(e, deviceId));
    }
  }

  function describeCameraError(e, deviceId) {
    switch (e.name) {
      // An `exact` deviceId that no longer matches anything.
      case 'OverconstrainedError':
      case 'NotFoundError':
        return deviceId ? 'Selected camera not available' : 'No camera found';
      case 'NotReadableError':
        return 'Camera is in use by another app';
      case 'NotAllowedError':
        return 'Camera access denied';
      default:
        return e.message;
    }
  }

  // Labels are only populated once camera permission has been granted, so this
  // has to run after the first successful getUserMedia.
  async function reportCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      window.api.reportCameras(
        devices
          .filter((d) => d.kind === 'videoinput')
          .map((d) => ({ deviceId: d.deviceId, label: d.label }))
      );
    } catch (_) {}
  }

  // Whether this overlay is on screen. A hidden one holds no camera at all, so
  // its capture light is off and the device is free for other apps.
  let visible = true;
  let cameraId = null;
  // Kept alongside the id so the same physical camera can be found again if
  // Chromium reissues ids — see resolveCameraId().
  let cameraLabel = null;

  /**
   * Chromium salts device ids per profile, so an id saved by a different build —
   * or after the profile is reset — won't resolve even though the very same camera
   * is plugged in. The stored label is what identifies it across that, so match on
   * the label instead and report the corrected id back so it gets saved.
   *
   * This finds the *same* device under a new id. It is not switching cameras: if
   * the label doesn't match anything either, the saved id is returned unchanged so
   * startCamera fails and says so.
   *
   * Caveat: labels are only readable once something has been granted camera
   * access, so on a brand-new profile where the id is already stale there is
   * nothing to match against and the camera has to be picked again by hand.
   */
  async function resolveCameraId() {
    if (!cameraId) return null;
    try {
      const inputs = (await navigator.mediaDevices.enumerateDevices())
        .filter((d) => d.kind === 'videoinput');
      if (inputs.some((d) => d.deviceId === cameraId)) return cameraId;

      const match = cameraLabel && inputs.find((d) => d.label && d.label === cameraLabel);
      if (match) {
        cameraId = match.deviceId;
        window.api.reportCameraId(match.deviceId, match.label);
        return match.deviceId;
      }
    } catch (_) {}
    return cameraId;
  }

  async function activate() {
    await startCamera(await resolveCameraId());
    await reportCameras();
  }

  window.api.onVisible((on) => {
    if (on === visible) return;
    visible = on;
    if (on) activate();
    else releaseCamera();
  });

  window.api.onSetCamera((sel) => {
    cameraId    = sel?.id ?? null;
    cameraLabel = sel?.label ?? null;
    // Don't wake the device just to honour a setting change while hidden; the
    // new camera is picked up when the overlay is shown again.
    if (visible) activate();
  });

  navigator.mediaDevices.addEventListener('devicechange', async () => {
    if (!visible) return;
    await reportCameras();
    // Plugging the camera back in should just work. Without this the overlay
    // would sit on the error until you toggled it or reselected the device.
    if (cameraFailed) {
      await activate();
    }
  });

  // ---- Move / resize ----------------------------------------------------
  // Absolute offsets from the grab point, so the window can't drift.
  let drag = null;   // { kind: 'move' | 'resize', sx, sy, id }

  container.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;                    // left button only
    const kind = (e.target === grip) ? 'resize' : 'move';
    drag = { kind, sx: e.screenX, sy: e.screenY, id: e.pointerId };
    if (kind === 'resize') window.api.resizeStart();
    else                   window.api.moveStart();
    // Capture keeps pointermove coming even when the cursor outruns the window.
    container.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  container.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.screenX - drag.sx;
    const dy = e.screenY - drag.sy;
    if (drag.kind === 'resize') window.api.resizeBy(dx, dy);
    else                        window.api.moveBy(dx, dy);
  });

  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag = null;
    window.api.dragEnd();
  }
  container.addEventListener('pointerup',     endDrag);
  container.addEventListener('pointercancel', endDrag);

  // ---- Right-click menu -------------------------------------------------
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    // Cancel any drag started by a chorded click so the window can't stick.
    if (drag) endDrag();
    window.api.showContextMenu();
  });

  // ---- Async startup ----------------------------------------------------
  // Deliberately LAST. getUserMedia can take a few seconds, and awaiting it
  // before wiring the listeners above left right-click (and dragging) dead
  // until the camera came up — the menu looked broken on every cold start.
  (async () => {
    let cfg = null;
    try {
      cfg = await window.api.getConfig();
      applyRadius(cfg.corner_radius);
      applyMirror(cfg.mirror);
      applyFit(cfg.fit);
      applyZoom(cfg.zoom);
      applyPan({ x: cfg.pan_x, y: cfg.pan_y });
    } catch (_) {}

    cameraId = cfg?.camera_id ?? null;
    cameraLabel = cfg?.camera_label ?? null;
    visible  = cfg?.visible !== false;

    // An overlay restored in the hidden state never opens its camera at all —
    // it waits until it is actually shown.
    if (visible) await activate();
  })();
})();
</script>
</body>
</html>
